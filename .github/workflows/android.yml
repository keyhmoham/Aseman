# Build the Flutter Android app (release APKs + an App Bundle) and attach them to the
# run as artifacts. The app reaches the server set by API_BASE_URL, compiled in with
# --dart-define (see app/lib/src/app_dependencies.dart).
#
# Build-time settings, each overridable without editing this file:
#   API_BASE_URL         the run's input → repository variable API_BASE_URL → http://pixelar.games:3000
#   DEVELOPER_API_BASE   repository variable (optional), shown in Profile → Developer API
#   OAUTH_REDIRECT_URI   repository variable (optional), see app/README.md
#
# The Elpian VM (Rust) is cross-compiled for every Android ABI by the plugin's Gradle
# task, so the job installs Rust, the Android targets and cargo-ndk first.
name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Server the app connects to
        required: false
        default: http://pixelar.games:3000

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'http://pixelar.games:3000' }}
      DEVELOPER_API_BASE: ${{ vars.DEVELOPER_API_BASE }}
      OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust toolchain for Android
        working-directory: .
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          # cargo-ndk needs an NDK; the runner ships one.
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/packages/elpian_vm_native/rust

      - name: Dependencies
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get

      - name: Build
        run: |
          defines=(--dart-define=API_BASE_URL="$API_BASE_URL")
          [ -n "$DEVELOPER_API_BASE" ] && defines+=(--dart-define=DEVELOPER_API_BASE="$DEVELOPER_API_BASE")
          [ -n "$OAUTH_REDIRECT_URI" ] && defines+=(--dart-define=OAUTH_REDIRECT_URI="$OAUTH_REDIRECT_URI")
          echo "Building against $API_BASE_URL"
          flutter build apk --release --split-per-abi "${defines[@]}"
          flutter build apk --release "${defines[@]}"
          flutter build appbundle --release "${defines[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: aseman-android-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
