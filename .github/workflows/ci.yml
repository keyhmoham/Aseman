# Checks every change: the node (vet, tests), the agent runtime, the Elpian
# kit and plugin checker, the evals' own tests, the app (analyze, tests), the
# Compose file and the Helm chart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Triage eval (rules only, no model)
        run: go run ./cmd/evals triage -rules-only -set ../evals/triage/emails.jsonl -out /tmp/triage.md

  runtime:
    name: Agent runtime (DeepSeek Harness)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/plugins/adapters/vmm/harness/runtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/plugins/adapters/vmm/harness/runtime/package-lock.json }
      - run: npm ci --no-audit --no-fund
      # Unit tests, and the real launcher and dsh against a fake node gateway.
      - run: npm test

  elpian:
    name: Elpian kit and plugin checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: deploy/tool-runtime/package-lock.json }
      # QuickJS for the checker (the same engine the client runs programs on).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: deploy/tool-runtime
      # The Elpian validator, driver and checks.
      - run: node --test deploy/sandbox-computer/appui/elpian/test/*.test.mjs
      # The App UI kit: the wiring check every build passes, and the server SDK.
      - run: node --test deploy/sandbox-computer/appui/test/*.test.mjs deploy/sandbox-computer/appui/sdk/server.test.js

  study-planner:
    name: Study planner workflow app (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The app the workflow installs: planner, agent loop and server, offline.
      - run: python3 test_app.py && python3 plan_tool.py selftest
        working-directory: docs/workflows/study-planner/app
      # The workflow document carries exactly this source.
      - run: python3 docs/workflows/study-planner/bundle.py --check
      # The Elpian frontend: its Jalali calendar against ICU, the program on
      # QuickJS and its end-to-end scenarios, against the app's server.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: deploy/tool-runtime/package-lock.json }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: deploy/tool-runtime
      - name: Elpian frontend
        working-directory: docs/workflows/study-planner/app
        run: |
          KIT=../../../../deploy/sandbox-computer/appui/elpian
          node --test elpian/test/jalali.test.mjs
          node $KIT/bundle.mjs .
          PLANNER_QUIET=1 PLANNER_MODE=draft PORT=8787 DATA_DIR=$RUNNER_TEMP/sp python3 server.py &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/healthz && break; sleep 0.5; done
          echo '{"apps":[],"agents":[]}' > $RUNNER_TEMP/APPS.json
          node $KIT/check.mjs elpian/app.js --apps $RUNNER_TEMP/APPS.json --server http://127.0.0.1:8787
          node $KIT/drive.mjs run elpian/e2e --dir . --bundle elpian/app.js --server http://127.0.0.1:8787

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Infos are advice; warnings and errors fail.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  deploy:
    name: Compose and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q && docker compose --profile spire config -q
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - run: helm lint deploy/helm/aseman
      - run: helm template ci deploy/helm/aseman --set sandbox.backend=docker,ingress.enabled=true > /dev/null
