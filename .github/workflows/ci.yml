# Checks every change: the node (vet, tests), the agent runtime, the Elpian
# kit and plugin checker, the evals' own tests, the app (analyze, tests), the
# Compose file and the Helm chart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Triage eval (rules only, no model)
        run: go run ./cmd/evals triage -rules-only -set ../evals/triage/emails.jsonl -out /tmp/triage.md

  runtime:
    name: Agent runtime (DeepSeek Harness)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/plugins/adapters/vmm/harness/runtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/plugins/adapters/vmm/harness/runtime/package-lock.json }
      - run: npm ci --no-audit --no-fund
      # Unit tests, and the real launcher and dsh against a fake node gateway.
      - run: npm test

  elpian:
    name: Elpian kit and plugin checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: deploy/tool-runtime/package-lock.json }
      # QuickJS for the checker (the same engine the client runs programs on).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: deploy/tool-runtime
      # The validator, driver and checks, and plugin-check (web plugins load
      # in the runner's Chrome).
      - run: node --test deploy/sandbox-computer/appui/elpian/test/*.test.mjs

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Infos are advice; warnings and errors fail.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  deploy:
    name: Compose and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q && docker compose --profile spire config -q
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - run: helm lint deploy/helm/aseman
      - run: helm template ci deploy/helm/aseman --set sandbox.backend=docker,ingress.enabled=true > /dev/null
