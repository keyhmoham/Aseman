# On every push to dev: ship the repo to the DEV server over SSH and (re)start the whole
# stack there with docker compose, exactly like deploy.yml does for main. It uses its own
# DEPLOY_*_DEV secrets and never touches the production server. The dev server keeps its
# own .env (APP_DOMAIN, API_DOMAIN, dev Modal environment, dev admin password, ...).
#
# Setup (once): see deploy/README.md, "Dev server".
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the stack to the dev server
    runs-on: ubuntu-latest
    # Only ever the dev branch, also for a manual run.
    if: github.ref == 'refs/heads/dev'
    environment: preview
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_DEV }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER_DEV }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_DEV || '/opt/aseman' }}
      PROD_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      # A missing or mistyped secret must fail here, never fall through to production.
      - name: Check the target is the dev server
        env:
          DEV_KEY: ${{ secrets.DEPLOY_SSH_KEY_DEV }}
        run: |
          [ -n "$DEPLOY_HOST" ] || { echo "DEPLOY_HOST_DEV is not set" >&2; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "DEPLOY_USER_DEV is not set" >&2; exit 1; }
          [ -n "$DEV_KEY" ] || { echo "DEPLOY_SSH_KEY_DEV is not set" >&2; exit 1; }
          if [ "$DEPLOY_HOST" = "$PROD_HOST" ]; then
            echo "DEPLOY_HOST_DEV is the production host; refusing to deploy dev there" >&2; exit 1
          fi

      # The key and ssh config live in the job's temp folder and are removed at the end.
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_DEV }}
        run: |
          dir="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/id_deploy"
          chmod 600 "$dir/id_deploy"
          ssh-keyscan -H "$DEPLOY_HOST" > "$dir/known_hosts" 2>/dev/null
          cat > "$dir/config" <<CFG
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $dir/id_deploy
            UserKnownHostsFile $dir/known_hosts
            ServerAliveInterval 30
          CFG
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"

      - name: Upload the repo
        run: |
          ssh -F "$SSH_CONFIG" deploy "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete -e "ssh -F $SSH_CONFIG" \
            --exclude '.git' --exclude '.github' \
            --exclude 'app/build' --exclude 'app/.dart_tool' \
            --exclude '/.env' --exclude 'services/configs/config.yml' \
            ./ "deploy:$DEPLOY_PATH/"

      - name: Start the stack (server builds)
        run: |
          ssh -F "$SSH_CONFIG" deploy bash -s <<REMOTE
          set -euo pipefail
          cd '$DEPLOY_PATH'
          [ -f .env ] || { echo "Missing $DEPLOY_PATH/.env on the server. See deploy/README.md." >&2; exit 1; }
          # The agents' memory server (OpenViking) needs a root key: made once, kept in .env.
          grep -qs '^ASEMAN_OPENVIKING_ROOT_KEY=.' .env || printf '\\nASEMAN_OPENVIKING_ROOT_KEY=%s\\n' "\$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n')" >> .env
          # The node's account in the timelines' server (Utopia): made once, kept in .env.
          grep -qs '^ASEMAN_TIMELINE_PASSWORD=.' .env || printf '\\nASEMAN_TIMELINE_PASSWORD=%s\\n' "\$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n')" >> .env
          mkdir -p /tmp/aseman-nomad
          docker image prune -af --filter "until=72h"
          docker builder prune -f --keep-storage 6GB
          df -h /
          # Build first while the site keeps running; only then swap the containers.
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml build
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml rm --stop --force
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --no-build --remove-orphans
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml ps
          docker image prune -af --filter "until=72h"
          docker builder prune -f --keep-storage 6GB
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
