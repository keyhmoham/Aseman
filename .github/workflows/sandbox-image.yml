# Publishes the sandbox computer image to GHCR. It is a by-product of the sandbox
# changing, not of every push: this only runs when deploy/sandbox-computer (or this
# file) changes, or when started by hand. The public image is what Modal sandboxes
# run; the platform deploy (deploy.yml) does not use it. A push to main publishes
# :latest (production); a push to dev publishes :dev (the dev server), never :latest.
name: Sandbox image

on:
  push:
    branches: [main, dev]
    paths:
      - "deploy/sandbox-computer/**"
      - "deploy/tool-runtime/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:

concurrency:
  group: sandbox-image
  cancel-in-progress: false

jobs:
  sandbox-image:
    name: Publish sandbox-computer to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names (registry names must be lowercase)
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "SANDBOX_IMAGE=ghcr.io/$owner/tradera-sandbox-computer" >> "$GITHUB_ENV"
          echo "TOOL_RUNTIME_IMAGE=ghcr.io/$owner/tradera-tool-runtime:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sandbox computer copies the tool runtime (tools installed into a
      # space run in its sandbox), so the runtime is published first.
      - uses: docker/build-push-action@v6
        with:
          context: deploy/tool-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TOOL_RUNTIME_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tool-runtime
          cache-to: type=gha,mode=max,scope=tool-runtime

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short
          # Links the package to this repo so it inherits the repo's visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox-computer
          build-args: TOOL_RUNTIME_IMAGE=${{ env.TOOL_RUNTIME_IMAGE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
