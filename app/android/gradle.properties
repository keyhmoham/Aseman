org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 (the latest stable) still names
# proguard-android.txt, which AGP 9 refuses by default. Drop this once the
# plugin ships proguard-android-optimize.txt (it does in 1.2.0 betas).
android.r8.proguardAndroidTxt.disallowed=false
# flutter_js 0.8.7 (the latest) pins Kotlin to JVM 1.8 while its Java compiles
# at 11; the Kotlin plugin fails the build on that mismatch. Both are dexed
# fine, so report it as a warning instead.
kotlin.jvm.target.validation.mode=warning
