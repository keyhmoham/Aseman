# The stack's own node (the `aseman` service), on the same origin as the app.
location ~ ^/(v1|fed|healthz) {
    proxy_pass http://aseman:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # $host has no port: the node checks a desktop socket's Origin
    # (http://host:3000) against the host the page was really served from.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;   # agent turns and image generation can be slow
    proxy_send_timeout 600s;
    proxy_buffering off;
}
