# A self-hosted Decillion stack on the host's own localhost:8080
# (`./aseman.sh up --local`). A literal loopback address, so it is proxied
# directly instead of through the decillion template's nginx `resolver`
# (which only does real DNS and cannot resolve "localhost"); host.docker.internal
# is reachable from inside the container (see docker-compose.yml's
# extra_hosts) and reaches the host's own loopback in turn.
location ~ ^/(v1|fed|healthz) {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    # Literal localhost:8080: matches the self-hosted node's own idea of
    # itself, same as a browser reaching it there directly would send.
    proxy_set_header Host localhost:8080;
    proxy_set_header Origin http://localhost:8080;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;   # agent turns and image generation can be slow
    proxy_send_timeout 600s;
    proxy_buffering off;
}
