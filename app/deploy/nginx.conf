# Serves the Flutter web build and proxies the aseman API on the same
# origin (the app is built with API_BASE_URL=same-origin).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 80m;   # file uploads (server limit: 64MB)

    root /usr/share/nginx/html;
    index index.html;

    # Compress JS/WASM/fonts/CSS — large win for CanvasKit and main.dart.js.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml
        application/manifest+json;

    # aseman API, federation endpoints, health and sandbox proxies
    # (/v1/proxy/{id}/... may be websockets, e.g. dev servers).
    location ~ ^/(v1|fed|healthz) {
        proxy_pass http://aseman:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $host has no port: the node checks a desktop socket's Origin
        # (http://host:3000) against the host the page was really served from.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;   # agent turns and image generation can be slow
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # HTML entry + bootstrap: always revalidate so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Content-addressed / rarely changing engine assets. Filenames for
    # CanvasKit and hashed assets are stable within a build; long-cache them
    # so return visits skip megabytes of re-download. index.html stays
    # no-cache so a new build is never mixed with stale entrypoints.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:wasm)$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ~* \.(?:js)$ {
        # main.dart.js and deferred chunks: short revalidation window.
        # Prefer immutable when builds use content hashes; still safe with
        # no-cache entry HTML forcing a fresh bootstrap that points at them.
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|webp|gif|ico|svg|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
