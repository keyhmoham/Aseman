# Serves the Flutter web build and proxies the node's API on the same origin
# (the app is built with API_BASE_URL=same-origin).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 80m;   # file uploads (server limit: 64MB)

    root /usr/share/nginx/html;
    index index.html;

    # Compress JS/WASM/fonts/CSS — large win for CanvasKit and main.dart.js.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml
        application/manifest+json;

    # The node's API, federation endpoints, health and sandbox proxies
    # (/v1/proxy/{id}/... may be websockets, e.g. dev servers): the stack's own
    # node (api.local.conf), or a Decillion node elsewhere
    # (api.decillion.conf.template, `./aseman.sh up --decillion`).
    include /etc/nginx/aseman-api.conf;

    # HTML entry + bootstrap: always revalidate so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Content-addressed / rarely changing engine assets. Filenames for
    # CanvasKit and hashed assets are stable within a build; long-cache them
    # so return visits skip megabytes of re-download. index.html stays
    # no-cache so a new build is never mixed with stale entrypoints.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:wasm)$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ~* \.(?:js)$ {
        # main.dart.js and deferred chunks: short revalidation window.
        # Prefer immutable when builds use content hashes; still safe with
        # no-cache entry HTML forcing a fresh bootstrap that points at them.
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|webp|gif|ico|svg|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
