# Serves the Flutter web build and proxies the tradera API on the same
# origin (the app is built with API_BASE_URL=same-origin).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 80m;   # file uploads (server limit: 64MB)

    root /usr/share/nginx/html;
    index index.html;

    # tradera API, federation endpoints, health and sandbox proxies
    # (/v1/proxy/{id}/... may be websockets, e.g. dev servers).
    location ~ ^/(v1|fed|healthz) {
        proxy_pass http://tradera:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $host has no port: the node checks a desktop socket's Origin
        # (http://host:3000) against the host the page was really served from.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;   # agent turns and image generation can be slow
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Flutter's web files keep their names from build to build (main.dart.js,
    # the tree-shaken MaterialIcons font, …), so browsers revalidate every one
    # (a 304 when unchanged): a new build is never mixed with cached pieces of
    # an old one, such as an icon font missing the new build's icons.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
