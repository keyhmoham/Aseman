# Debug client: the browser talks to this port only. The Decillion API stays
# on the same origin (as the release image does; see render-api-conf.sh),
# and every other request — including the hot-reload stream — goes to
# `flutter run -d web-server`. The Flutter server listens on 127.0.0.1:7357
# (app/tool/debug_server.sh).
worker_processes 1;
daemon off;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 80m;
    # SSE (the hot-reload client) must not be buffered or gzipped.
    gzip off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;
        server_name _;

        # Decillion API, federation endpoints, health and sandbox proxies
        # (/v1/proxy/{id}/... may be websockets, e.g. dev servers). Rendered
        # by render-api-conf.sh before this nginx starts (tool/debug_server.sh).
        include /etc/nginx/aseman-api.conf;

        location / {
            proxy_pass http://127.0.0.1:7357;
            proxy_http_version 1.1;
            # The debug client connects back to this host for hot reload.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
