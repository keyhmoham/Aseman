name: aseman_elpian_godot
description: The embedded Godot 4 engine behind the Scene3D widget of the app's Elpian engine (Android/iOS platform views and the op transport). The Dart side lives in lib/src/elpian/godot of the app.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.elpian.godot
        pluginClass: ElpianGodotPlugin
      ios:
        pluginClass: ElpianGodotPlugin
