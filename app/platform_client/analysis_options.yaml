# The client's own code (lib/client, lib/main.dart, test). lib/src is the
# app's code (tool/shared.txt), copied in by tool/assemble.sh and analyzed in
# the app.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - lib/src/**
  errors:
    deprecated_member_use: ignore
linter:
  rules:
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    prefer_final_fields: true
    prefer_const_constructors: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true
