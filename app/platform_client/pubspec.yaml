name: aseman_platform_client
description: A platform's lightweight client — the Elpian engine and what it needs to reach Aseman, built for one platform's published frontend.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# Only what the Elpian engine, the UI kit and the client use (tool/shared.txt
# lists the app sources it shares; the versions follow app/pubspec.yaml).
# The Elpian VM's native library and the Godot engine are left out: a
# platform's frontend runs on QuickJS, and a 3D scene shows its placeholder.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  video_player: ^2.11.0
  just_audio: ^0.9.44
  collection: ^1.17.0
  ffi: ^2.1.0
  flutter_js: ^0.8.3
  webview_flutter: ^4.14.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # What this build is for (platform_client_build writes it).
    - assets/client.json
  # Generic CSS families for Elpian content (copied from app/assets/elpian/fonts
  # by tool/assemble.sh).
  fonts:
    - family: serif
      fonts:
        - asset: assets/elpian/fonts/LiberationSerif-Regular.ttf
        - asset: assets/elpian/fonts/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/elpian/fonts/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/elpian/fonts/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: monospace
      fonts:
        - asset: assets/elpian/fonts/LiberationMono-Regular.ttf
        - asset: assets/elpian/fonts/LiberationMono-Bold.ttf
          weight: 700
