name: tradera
description: Tradera — an agentic social workspace for traders.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  shared_preferences: ^2.3.2
  file_selector: ^1.1.0
  video_player: ^2.11.0
  just_audio: ^0.9.44
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  sign_in_with_apple: ^8.2.0
  # The Elpian engine (lib/src/elpian) and its native VM (packages/elpian_vm_native)
  # are part of this app; these are the packages the engine itself uses.
  tradera_elpian_vm:
    path: packages/elpian_vm_native
  # The embedded Godot engine behind Scene3D (packages/elpian_godot_native).
  tradera_elpian_godot:
    path: packages/elpian_godot_native
  collection: ^1.17.0
  ffi: ^2.1.0
  flutter_js: ^0.8.3
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  flutter_svg: ^2.3.0
  # Generative UI (A2UI v0.9): surfaces, data model and catalog runtime.
  genui: ^0.10.4
  a2ui_core: ^0.1.1
  json_schema_builder: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # The Elpian VM (WebAssembly) and QuickJS runtimes for the web build.
    - assets/elpian/web_runtime/quickjs_web_runtime.js
    - assets/elpian/web_runtime/elpian_wasm_loader.js
    - assets/elpian/web_runtime/vendor/quickjs-emscripten.mjs
    - assets/elpian/web_runtime/vendor/quickjs-emscripten.wasm
    - assets/elpian/web_runtime/wasm/elpian_vm/elpian_vm.js
    - assets/elpian/web_runtime/wasm/elpian_vm/elpian_vm_bg.wasm

  # Generic CSS families for Elpian content: `serif` and `monospace` (and the
  # stacks that fall back to them) need real faces; Flutter has only its sans.
  fonts:
    - family: serif
      fonts:
        - asset: assets/elpian/fonts/LiberationSerif-Regular.ttf
        - asset: assets/elpian/fonts/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/elpian/fonts/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/elpian/fonts/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: monospace
      fonts:
        - asset: assets/elpian/fonts/LiberationMono-Regular.ttf
        - asset: assets/elpian/fonts/LiberationMono-Bold.ttf
          weight: 700
