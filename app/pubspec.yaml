name: tradera
description: Tradera — an agentic social workspace for traders.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  shared_preferences: ^2.3.2
  file_selector: ^1.1.0
  video_player: ^2.11.0
  just_audio: ^0.9.44
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  sign_in_with_apple: ^8.2.0
  elpian_ui:
    path: third_party/elpian
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
