# Production overlay: put the stack behind one Caddy that terminates HTTPS and
# routes by domain. Use with the base file:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Needs Docker Compose >= 2.24 (the !override tag). The domains are set in the
# root .env (APP_DOMAIN, API_DOMAIN, ACME_EMAIL) and routed in deploy/caddy/Caddyfile.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - tradera
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (e.g. app.example.com)}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env (e.g. connect.example.com)}
      # The developer API (bearer keys) on its own host; unset leaves it off.
      DEVELOPER_DOMAIN: ${DEVELOPER_DOMAIN:-developer.localhost}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Only Caddy is public: the app and the node listen on the server's loopback.
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:80"

  tradera:
    ports: !override
      - "127.0.0.1:${TRADERA_PORT:-8080}:8080"
    environment:
      # What clients are told the node's address is.
      TRADERA_NODE_URL: https://${API_DOMAIN}

volumes:
  caddy-data:
  caddy-config:
