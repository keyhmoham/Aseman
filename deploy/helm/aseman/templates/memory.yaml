{{- $fn := include "aseman.fullname" . -}}
{{- if .Values.openviking.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-openviking-data
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.openviking.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.openviking.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-openviking
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "aseman.selector" (dict "root" . "component" "openviking") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aseman.selector" (dict "root" . "component" "openviking") | nindent 8 }}
    spec:
      containers:
        - name: openviking
          image: {{ include "aseman.image" .Values.images.openviking }}
          imagePullPolicy: {{ .Values.images.openviking.pullPolicy }}
          ports: [{ name: http, containerPort: 1933 }]
          env:
            - { name: OPENVIKING_NODE_URL, value: "http://{{ $fn }}-node:8080" }
            - name: OPENVIKING_ROOT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "aseman.secretName" . }}, key: ASEMAN_OPENVIKING_API_KEY } }
          readinessProbe: { httpGet: { path: /health, port: http } }
          resources: {{- toYaml .Values.openviking.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $fn }}-openviking-data }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-openviking
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  selector: {{- include "aseman.selector" (dict "root" . "component" "openviking") | nindent 4 }}
  ports: [{ name: http, port: 1933, targetPort: http }]
{{- end }}
{{- if .Values.timeline.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-timeline-data
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.timeline.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.timeline.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-timeline
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "aseman.selector" (dict "root" . "component" "timeline") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aseman.selector" (dict "root" . "component" "timeline") | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: timeline-db
          image: {{ include "aseman.image" .Values.images.postgres }}
          args: ["timeline-db"]
          env:
            - { name: PGHOST, value: "{{ $fn }}-postgres" }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: TIMELINE_DB, value: {{ .Values.postgres.timelineDatabase | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aseman.secretName" . }}, key: POSTGRES_PASSWORD } }
      {{- end }}
      containers:
        - name: timeline
          image: {{ include "aseman.image" .Values.images.timeline }}
          imagePullPolicy: {{ .Values.images.timeline.pullPolicy }}
          ports: [{ name: http, containerPort: 1516 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aseman.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: UTOPIA_DATABASE_URL
              value: {{ if .Values.postgres.enabled }}"postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ $fn }}-postgres:5432/{{ .Values.postgres.timelineDatabase }}"{{ else }}{{ required "postgres.timelineDSN is required with an external database" .Values.postgres.timelineDSN | quote }}{{ end }}
            - { name: UTOPIA_BIND_ADDR, value: "0.0.0.0:1516" }
            - { name: UTOPIA_DATA_DIR, value: /app/data }
            - { name: UTOPIA_WEB_DIST, value: /app/web-dist }
            - { name: UTOPIA_OPEN_REGISTRATION, value: "false" }
          resources: {{- toYaml .Values.timeline.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $fn }}-timeline-data }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-timeline
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  selector: {{- include "aseman.selector" (dict "root" . "component" "timeline") | nindent 4 }}
  ports: [{ name: http, port: 1516, targetPort: http }]
{{- end }}
