{{- if .Values.networkPolicy.enabled }}
{{- $fn := include "aseman.fullname" . -}}
{{- $root := . -}}
{{- if .Values.postgres.enabled }}
# Only the node and the timeline read the database. Project computers have a
# shell, so nothing they run may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aseman.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "aseman.selector" (dict "root" . "component" "node") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "aseman.selector" (dict "root" . "component" "timeline") | nindent 14 }}
      ports: [{ port: 5432 }]
{{- end }}
{{- range $component := list "openviking" "timeline" "runtime" }}
---
# {{ $component }} answers the node and the agent runtime only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-{{ $component }}
  labels: {{- include "aseman.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aseman.selector" (dict "root" $root "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "aseman.selector" (dict "root" $root "component" "node") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "aseman.selector" (dict "root" $root "component" "runtime") | nindent 14 }}
{{- end }}
{{- end }}
