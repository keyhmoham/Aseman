{{- $fn := include "aseman.fullname" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-node-data
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.node.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.node.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-node
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.node.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "aseman.selector" (dict "root" . "component" "node") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aseman.selector" (dict "root" . "component" "node") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.sandbox.backend "docker" }}
      {{- with .Values.sandbox.docker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: node
          image: {{ include "aseman.image" .Values.images.node }}
          imagePullPolicy: {{ .Values.images.node.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: {{ include "aseman.secretName" . }} }
            {{- with .Values.node.envFromSecret }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          env:
            - { name: ASEMAN_CONFIG, value: /app/config.yml }
            - { name: ASEMAN_HTTP_ADDR, value: ":8080" }
            - { name: ASEMAN_DATABASE_DSN, value: {{ include "aseman.dsn" . | quote }} }
            - { name: ASEMAN_PUBLIC_URL, value: {{ .Values.publicURL | quote }} }
            - { name: ASEMAN_NODE_URL, value: {{ .Values.publicURL | quote }} }
            - { name: ASEMAN_APP_URL, value: {{ .Values.appURL | quote }} }
            - { name: ASEMAN_AGENT_NODE_URL, value: "http://{{ $fn }}-node:8080" }
            - { name: ASEMAN_AGENT_RUNTIME_URL, value: "http://{{ $fn }}-runtime:8000" }
            - { name: ASEMAN_SANDBOX_BACKEND, value: {{ .Values.sandbox.backend | quote }} }
            - { name: ASEMAN_MODAL_ENVIRONMENT, value: {{ .Values.sandbox.modal.environment | quote }} }
            {{- if eq .Values.sandbox.backend "docker" }}
            - { name: ASEMAN_DOCKER_HOST, value: "unix:///var/run/docker.sock" }
            - { name: ASEMAN_SANDBOX_DOCKER_NETWORK, value: {{ .Values.sandbox.docker.network | quote }} }
            - { name: ASEMAN_SANDBOX_RUNTIME, value: {{ .Values.sandbox.docker.runtime | quote }} }
            - { name: ASEMAN_EGRESS_IMAGE, value: {{ .Values.sandbox.egressImage | quote }} }
            {{- end }}
            {{- if .Values.openviking.enabled }}
            - { name: ASEMAN_OPENVIKING_URL, value: "http://{{ $fn }}-openviking:1933" }
            {{- end }}
            - { name: ASEMAN_TIMELINE_URL, value: {{ if .Values.timeline.enabled }}"http://{{ $fn }}-timeline:1516"{{ else }}""{{ end }} }
            - { name: ASEMAN_GOVERNANCE_REQUIRED, value: {{ ternary "1" "0" .Values.governance.required | quote }} }
            - { name: ASEMAN_APPROVAL_TIMEOUT, value: {{ .Values.governance.approvalTimeout | quote }} }
            {{- range $k, $v := .Values.node.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30, failureThreshold: 5 }
          resources: {{- toYaml .Values.node.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /app/config.yml, subPath: config.yml }
            - { name: data, mountPath: /app/data }
            {{- if eq .Values.sandbox.backend "docker" }}
            - { name: docker, mountPath: /var/run/docker.sock }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ $fn }}-config }
        - name: data
          persistentVolumeClaim: { claimName: {{ $fn }}-node-data }
        {{- if eq .Values.sandbox.backend "docker" }}
        - name: docker
          hostPath: { path: {{ .Values.sandbox.docker.socketPath }}, type: Socket }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-node
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  selector: {{- include "aseman.selector" (dict "root" . "component" "node") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
