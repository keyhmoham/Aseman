{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aseman.secretName" . }}
  labels: {{- include "aseman.labels" . | nindent 4 }}
type: Opaque
data:
  ASEMAN_ADMIN_PASSWORD: {{ include "aseman.secretValue" (dict "root" . "key" "ASEMAN_ADMIN_PASSWORD" "value" .Values.secrets.adminPassword) }}
  ASEMAN_TIMELINE_PASSWORD: {{ include "aseman.secretValue" (dict "root" . "key" "ASEMAN_TIMELINE_PASSWORD" "value" .Values.secrets.timelinePassword) }}
  ASEMAN_OPENVIKING_API_KEY: {{ include "aseman.secretValue" (dict "root" . "key" "ASEMAN_OPENVIKING_API_KEY" "value" .Values.secrets.openvikingKey) }}
  ASEMAN_AGENT_RUNTIME_SECRET: {{ include "aseman.secretValue" (dict "root" . "key" "ASEMAN_AGENT_RUNTIME_SECRET" "value" .Values.secrets.runtimeSecret) }}
  POSTGRES_PASSWORD: {{ include "aseman.secretValue" (dict "root" . "key" "POSTGRES_PASSWORD" "value" .Values.postgres.password) }}
  ASEMAN_MODAL_TOKEN_ID: {{ .Values.sandbox.modal.tokenId | b64enc | quote }}
  ASEMAN_MODAL_TOKEN_SECRET: {{ .Values.sandbox.modal.tokenSecret | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aseman.fullname" . }}-config
  labels: {{- include "aseman.labels" . | nindent 4 }}
data:
  config.yml: {{ .Values.config | quote }}
