{{- $fn := include "aseman.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "aseman.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aseman.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "aseman.image" .Values.images.web }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: http } }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-web
  labels: {{- include "aseman.labels" . | nindent 4 }}
spec:
  selector: {{- include "aseman.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports: [{ name: http, port: 80, targetPort: http }]
