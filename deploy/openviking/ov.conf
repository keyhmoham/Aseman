{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "cors_origins": [],
    "timeout_keep_alive": 75,
    "trusted_identity_flush_interval_seconds": 5
  },
  "storage": {
    "workspace": "/data"
  },
  "memory": {
    "session_auto_commit": {
      "enabled": true,
      "check_interval_seconds": 300
    }
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "model": "aseman-memory-embedding",
      "api_key": "${OPENVIKING_ROOT_API_KEY}",
      "api_base": "${OPENVIKING_NODE_URL}/deepagents/v1/memory",
      "dimension": 1536,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "openai",
    "model": "aseman-memory-chat",
    "api_key": "${OPENVIKING_ROOT_API_KEY}",
    "api_base": "${OPENVIKING_NODE_URL}/deepagents/v1/memory",
    "temperature": 0.0,
    "max_retries": 2
  }
}
