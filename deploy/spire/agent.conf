# SPIRE agent beside the agent runtime. It attests the runtime's container
# (docker workload attestor) and serves SVIDs on the Workload API socket that
# spiffe-helper reads.
agent {
  data_dir = "/run/spire/agent"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/sockets/agent.sock"
  trust_domain = "aseman.internal"
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}
