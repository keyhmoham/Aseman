# spiffe-helper keeps the agent runtime's JWT-SVID fresh in a file the
# runtime reads (ASEMAN_SVID_FILE) and sends with every gateway call.
agent_address = "/run/spire/sockets/agent.sock"
cert_dir = "/run/spire/svid"
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "bundle.pem"
jwt_svids = [{ jwt_audience = "aseman", jwt_svid_file_name = "jwt_svid.token" }]
daemon_mode = true
