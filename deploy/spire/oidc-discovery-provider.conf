# Serves the trust domain's JWT signing keys as a JWKS document (/keys) for the
# node, which checks the agent runtime's JWT-SVIDs against it. Plain HTTP on
# the stack's network only.
log_level = "INFO"
domains = ["spire-oidc"]
allow_insecure_scheme = true
listen_socket_path = ""
insecure_addr = ":8008"
server_api {
  address = "unix:///run/spire/server/private/api.sock"
}
