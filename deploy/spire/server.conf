# SPIRE server for an Aseman deployment's workload identity. It issues the
# agent runtime a JWT-SVID (audience "aseman") that the node checks on every
# agent-gateway call, on top of the turn token. Enable it in Admin →
# Enterprise → Workload identity with trust domain "aseman.internal" and
# bundle address http://spire-oidc:8008/keys (oidc-discovery-provider.conf).
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "aseman.internal"
  data_dir = "/run/spire/data"
  socket_path = "/tmp/spire-server/api.sock"
  log_level = "INFO"
  ca_ttl = "168h"
  default_x509_svid_ttl = "1h"
  default_jwt_svid_ttl = "5m"
  jwt_key_type = "ec-p256"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
