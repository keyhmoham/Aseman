# Aseman Flutter client — one command:
#
#   ./aseman.sh up
#   # Hot reload (debug Flutter client) is the default. A release web image:
#   #   ./aseman.sh up --no-hot-reload
#   # or: docker compose up -d --build   (release web image)
#
# The app's API is a Decillion node: by default https://preview.decillionai.com
# (or DECILLION_API_URL). `./aseman.sh up --local` points it at a self-hosted
# Decillion stack on the host's own localhost:8080 instead.
name: aseman

services:
  web:
    build:
      context: ./app
      args:
        # The developer API console shows where to call once a developer host is set.
        DEVELOPER_API_BASE: ${DEVELOPER_API_BASE:-${DEVELOPER_DOMAIN:+https://${DEVELOPER_DOMAIN}/v1}}
    image: aseman/flutter-web:latest
    restart: unless-stopped
    environment:
      DECILLION_API_URL: ${DECILLION_API_URL:-https://preview.decillionai.com}
      DECILLION_API_HOST: ${DECILLION_API_HOST:-}
      DECILLION_API_RESOLVER: ${DECILLION_API_RESOLVER:-1.1.1.1 8.8.8.8}
    # So a literal "localhost" API (`./aseman.sh up --local`) can still be
    # reached from inside the container; see app/deploy/api.local.conf.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:80"
