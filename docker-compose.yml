# Aseman / aseman — full stack in one command:
#
#   ./aseman.sh up [path/to/config.yml]
#   # Hot reload (debug Flutter client) is the default. A release web image:
#   #   ./aseman.sh up --no-hot-reload
#   # or: docker compose up -d --build   (release web image; config.example.yml)
#
# The config file only carries node identity, Google sign-in (optional) and the
# Modal credentials. Postgres, Nomad, the docker sandbox host, storage and HTTP
# are wired here through ASEMAN_* environment variables, and LLM providers
# (API keys, models, token prices) are managed in the app's admin panel.
# Optional settings live in .env (see .env.example).
name: aseman

services:
  # The stack's one Postgres: the node's records, and the spaces' timelines
  # (Utopia) in a database of their own. postgres:16-alpine with pgvector
  # added (deploy/postgres), so existing data volumes keep working.
  postgres:
    build: ./deploy/postgres
    image: aseman/postgres:16-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aseman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aseman}
      POSTGRES_DB: ${POSTGRES_DB:-aseman}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Only on the data network: project computers (which have a shell) join
    # the default network, and must not reach the database.
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nomad:
    image: hashicorp/nomad:${NOMAD_VERSION:-1.10}
    restart: unless-stopped
    command:
      - agent
      - -config=/etc/nomad.d/nomad.hcl
      - -data-dir=${NOMAD_DATA_DIR:-/tmp/aseman-nomad}
    # The docker task driver manages containers on the host docker daemon.
    # Use the host cgroup namespace so the nomad client can create its own
    # cgroups (cgroup v2 subtree_control) inside the container.
    privileged: true
    cgroup: host
    volumes:
      - ./deploy/nomad/nomad.hcl:/etc/nomad.d/nomad.hcl:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: allocation dirs are bind-mounted into
      # task containers by the host docker daemon.
      - ${NOMAD_DATA_DIR:-/tmp/aseman-nomad}:${NOMAD_DATA_DIR:-/tmp/aseman-nomad}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4646/v1/status/leader | grep -q ':'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The sandbox computer: the default per-space sandbox image (the shared
  # shell and files of a space's agents). Built here so the node can create
  # sandboxes from it; the container itself exits immediately.
  sandbox-computer:
    build:
      context: ./deploy/sandbox-computer
      # The tool runtime below, copied into the image: tools installed into a
      # space run inside its sandbox on it.
      additional_contexts:
        tool-runtime-image: service:tool-runtime
      args:
        TOOL_RUNTIME_IMAGE: tool-runtime-image
    image: aseman/sandbox-computer:latest
    command: ["true"]
    restart: "no"

  # The tool runtime: runs tool backends written for the Elpian VM (Dart or
  # the Elpian JS subset) or QuickJS and serves their microtools over MCP. The
  # node runs it as Nomad services for managed tools; the sandbox computer
  # carries it for installed tools; and this service runs it as the node's
  # compiler (Elpian frontends to bytecode, backends' microtool lists). The
  # tag is pinned because Nomad always pulls ":latest" images.
  tool-runtime:
    build: ./deploy/tool-runtime
    image: aseman/tool-runtime:v1
    command: ["node", "server.mjs", "--compiler"]
    restart: unless-stopped

  # The filtering proxy beside each project computer (services/cmd/aseman-egress).
  # Built here; the node runs it as a sidecar in a computer's network namespace
  # when the computer starts, and the computer's shell and browser go through it.
  egress-proxy:
    build:
      context: ./services
      dockerfile: ../deploy/egress-proxy/Dockerfile
    image: aseman/egress-proxy:v1
    command: ["version"]
    restart: "no"

  # The agent runtime. By default it is LangChain Deep Agents on LangGraph.
  # Admin → Agentic engine can run the same turns through the OpenCode CLI
  # in this image (its own free models). Built here; the node runs it as a
  # Nomad service on the stack's network (alias aseman-deepagents) the first
  # time an agent works. The tag is pinned because Nomad always pulls ":latest".
  deepagents:
    build: ./services/plugins/adapters/vmm/deepagents/runtime
    image: aseman/deepagents:v2
    command: ["true"]
    restart: "no"

  # Self-hosted OpenViking (https://openviking.ai): the context database that
  # keeps the agents' memory (each space is an account, each agent a user).
  # Reached only on the stack's network, by the deep agents runtime and the
  # node, with the root key (./aseman.sh up generates one into .env). It
  # has no model settings: it calls its models through the node, which uses
  # the ones picked under Admin → Memory models.
  openviking:
    build: ./deploy/openviking
    image: aseman/openviking:v1
    restart: unless-stopped
    environment:
      OPENVIKING_ROOT_API_KEY: ${ASEMAN_OPENVIKING_ROOT_KEY:?set ASEMAN_OPENVIKING_ROOT_KEY in .env (./aseman.sh up generates one)}
      OPENVIKING_NODE_URL: http://aseman:8080
    volumes:
      - openviking-data:/data

  # Creates the timelines' database on the node's Postgres (with pgvector)
  # if it is missing, then exits. Runs on every start; changes nothing when
  # the database is there.
  timeline-db:
    build: ./deploy/postgres
    image: aseman/postgres:16-pgvector
    command: ["timeline-db"]
    restart: "no"
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-aseman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aseman}
      POSTGRES_DB: ${POSTGRES_DB:-aseman}
      TIMELINE_DB: ${ASEMAN_TIMELINE_DB:-aseman_timeline}

  # The spaces' timelines: Utopia (https://github.com/deeplethe/utopia), a
  # bitemporal knowledge graph, on the node's own Postgres (no database of its
  # own). The node pushes each space's events into it and serves it to every
  # agent as a built-in MCP server. Reached only on the stack's network; the
  # node signs in with ASEMAN_TIMELINE_PASSWORD (./aseman.sh up
  # generates one). Its own web console is not published.
  timeline:
    image: ${ASEMAN_TIMELINE_IMAGE:-ghcr.io/deeplethe/utopia:0.1.0-rc9}
    restart: unless-stopped
    depends_on:
      timeline-db:
        condition: service_completed_successfully
    networks: [data]
    environment:
      UTOPIA_DATABASE_URL: postgres://${POSTGRES_USER:-aseman}:${POSTGRES_PASSWORD:-aseman}@postgres:5432/${ASEMAN_TIMELINE_DB:-aseman_timeline}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      UTOPIA_DATA_DIR: /app/data
      UTOPIA_WEB_DIST: /app/web-dist
      # Only the first account (the node's) may register.
      UTOPIA_OPEN_REGISTRATION: "false"
      # Its share of the node's Postgres connections (max_connections 100).
      UTOPIA_DB_MAX_CONNECTIONS: ${ASEMAN_TIMELINE_DB_CONNECTIONS:-16}
    volumes:
      # Full-text index, the signing and sealing keys Utopia generates.
      - timeline-data:/app/data

  # Local STT/TTS for Talk (Admin → AI → Voice): OpenAI-compatible
  # /v1/audio/transcriptions + /v1/audio/speech. The node reaches it as
  # http://voice:8091/v1 (not 127.0.0.1 — that is the aseman container itself).
  voice:
    build: ./deploy/voice
    image: aseman/voice:v1
    restart: unless-stopped
    environment:
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: "8091"
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nemo-parakeet-tdt-0.6b-v3}
      PARAKEET_DEVICE: ${PARAKEET_DEVICE:-cpu}
      PARAKEET_QUANTIZATION: ${PARAKEET_QUANTIZATION:-int8}
      STT_MODEL_ID: ${STT_MODEL_ID:-parakeet-tdt-0.6b-v3}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      KOKORO_DIR: /models
      VOICE_API_KEY: ${VOICE_API_KEY:-}
    volumes:
      # Cache Parakeet / Kokoro model downloads across restarts.
      - voice-models:/root/.cache
      - voice-kokoro:/models
    # Optional host access for debugging; the node uses the compose DNS name.
    ports:
      - "${VOICE_PORT:-8091}:8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot downloads Parakeet ONNX weights (~0.6B).
      start_period: 300s

  aseman:
    build: ./services
    image: aseman/asemand:latest
    restart: unless-stopped
    # The node is the one place the two networks meet.
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
      nomad:
        condition: service_healthy
      sandbox-computer:
        condition: service_completed_successfully
      deepagents:
        condition: service_completed_successfully
      tool-runtime:
        condition: service_started
      openviking:
        condition: service_healthy
      timeline:
        condition: service_started
      voice:
        condition: service_started
    environment:
      ASEMAN_CONFIG: /app/config.yml
      ASEMAN_DATABASE_DSN: postgres://${POSTGRES_USER:-aseman}:${POSTGRES_PASSWORD:-aseman}@postgres:5432/${POSTGRES_DB:-aseman}?sslmode=disable
      ASEMAN_NOMAD_URL: http://nomad:4646
      ASEMAN_DOCKER_HOST: unix:///var/run/docker.sock
      # Sandbox backbone: "docker" = one docker container per space (default),
      # "modal" = Modal remote sandboxes. One variable switches the whole stack.
      ASEMAN_SANDBOX_BACKEND: ${ASEMAN_SANDBOX_BACKEND:-docker}
      # Modal credentials (only used when the backend is "modal"). The config
      # file's modal: section wins if it sets them.
      ASEMAN_MODAL_TOKEN_ID: ${ASEMAN_MODAL_TOKEN_ID:-}
      ASEMAN_MODAL_TOKEN_SECRET: ${ASEMAN_MODAL_TOKEN_SECRET:-}
      # Modal environment (e.g. "dev") holding this node's sandboxes, volumes and
      # costs. Empty = the Modal profile default. Keep local and prod different.
      ASEMAN_MODAL_ENVIRONMENT: ${ASEMAN_MODAL_ENVIRONMENT:-}
      # Docker sandbox containers join the node's network so proxied sandbox
      # ports are reachable from this containerized node.
      ASEMAN_SANDBOX_DOCKER_NETWORK: ${ASEMAN_SANDBOX_DOCKER_NETWORK:-aseman_default}
      # Sandbox computer image (default: the sandbox computer built above).
      ASEMAN_SANDBOX_IMAGE: ${ASEMAN_SANDBOX_IMAGE:-aseman/sandbox-computer:latest}
      # The deep agents runtime: its image, the node as the runtime reaches it
      # (agent gateway + metered LLM proxy) and the network it joins.
      ASEMAN_AGENT_RUNTIME_IMAGE: ${ASEMAN_AGENT_RUNTIME_IMAGE:-aseman/deepagents:v2}
      # The filtering proxy run beside each project computer (empty: none, and
      # computers connect directly). Network policies are set per project.
      ASEMAN_EGRESS_IMAGE: ${ASEMAN_EGRESS_IMAGE:-aseman/egress-proxy:v1}
      # Run project computers under gVisor where the host has it (runsc).
      ASEMAN_SANDBOX_RUNTIME: ${ASEMAN_SANDBOX_RUNTIME:-}
      ASEMAN_AGENT_NODE_URL: ${ASEMAN_AGENT_NODE_URL:-http://aseman:8080}
      ASEMAN_AGENT_RUNTIME_NETWORK: ${ASEMAN_AGENT_RUNTIME_NETWORK:-aseman_default}
      # Memory (MB) the runtime reserves on Nomad. Lower it on a small server, raise it on a big one.
      ASEMAN_AGENT_RUNTIME_MEMORY_MB: ${ASEMAN_AGENT_RUNTIME_MEMORY_MB:-2048}
      # Set to run the runtime yourself instead (e.g. http://host:8000).
      ASEMAN_AGENT_RUNTIME_URL: ${ASEMAN_AGENT_RUNTIME_URL:-}
      # Bound a provider call, its time to first SSE event and silence between events.
      ASEMAN_LLM_CALL_TIMEOUT: ${ASEMAN_LLM_CALL_TIMEOUT:-5m}
      ASEMAN_LLM_FIRST_EVENT_TIMEOUT: ${ASEMAN_LLM_FIRST_EVENT_TIMEOUT:-2m}
      # Long App UI / sandbox tool rounds can leave the model quiet between
      # tool results; 45s was killing turns mid-appui_create.
      ASEMAN_LLM_STREAM_IDLE_TIMEOUT: ${ASEMAN_LLM_STREAM_IDLE_TIMEOUT:-180s}
      # Programmer OpenCode only (Admin → OpenCode, appui_create / opencode_run):
      # the sandbox coding agent uses the turn's metered LLM gateway
      # (/deepagents/v1/llm). The agentic engine does not read OPENCODE_MODEL;
      # when it is OpenCode, the runtime CLI uses OpenCode's free models and
      # seeds OpenCode Go auth from ASEMAN_OPENCODE_ENGINE_API_KEY (defaults to
      # OPENCODE_API_KEY) so free-tier daily limits do not stop the agent.
      # Optional overrides when sandboxes cannot resolve ASEMAN_AGENT_NODE_URL:
      ASEMAN_SANDBOX_LLM_URL: ${ASEMAN_SANDBOX_LLM_URL:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-aseman/default}
      # Also used as the agentic engine's OpenCode Go credential when
      # ASEMAN_OPENCODE_ENGINE_API_KEY is unset (see deepagents/runtime.go).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      ASEMAN_OPENCODE_ENGINE_API_KEY: ${ASEMAN_OPENCODE_ENGINE_API_KEY:-}
      ASEMAN_OPENCODE_ENGINE_AUTH: ${ASEMAN_OPENCODE_ENGINE_AUTH:-}
      # DeepSeek Harness agentic engine (Admin → Agentic engine = DeepSeek
      # Harness). By default it runs on the agents' platform models through
      # the metered gateway; set ASEMAN_DSH_ENGINE_LLM=deepseek with a key to
      # use the engine's own DeepSeek account instead.
      ASEMAN_DSH_ENGINE_LLM: ${ASEMAN_DSH_ENGINE_LLM:-}
      ASEMAN_DSH_ENGINE_API_KEY: ${ASEMAN_DSH_ENGINE_API_KEY:-}
      ASEMAN_DSH_ENGINE_MODEL: ${ASEMAN_DSH_ENGINE_MODEL:-}
      ASEMAN_DSH_ENGINE_WEB: ${ASEMAN_DSH_ENGINE_WEB:-}
      ASEMAN_DSH_ENGINE_TIMEOUT: ${ASEMAN_DSH_ENGINE_TIMEOUT:-}
      # The agents' memory: the self-hosted OpenViking above, as the runtime
      # reaches it, and how much it recalls with each message (tokens).
      ASEMAN_OPENVIKING_URL: ${ASEMAN_OPENVIKING_URL:-http://openviking:1933}
      ASEMAN_OPENVIKING_API_KEY: ${ASEMAN_OPENVIKING_ROOT_KEY:-}
      ASEMAN_OPENVIKING_RECALL_TOKENS: ${ASEMAN_OPENVIKING_RECALL_TOKENS:-1500}
      # The agent runtime's swarm and self-improvement (passed on to it).
      ASEMAN_SWARM_PARALLEL: ${ASEMAN_SWARM_PARALLEL:-}
      ASEMAN_IMPROVE: ${ASEMAN_IMPROVE:-}
      ASEMAN_IMPROVE_EVERY: ${ASEMAN_IMPROVE_EVERY:-}
      ASEMAN_IMPROVE_COOLDOWN: ${ASEMAN_IMPROVE_COOLDOWN:-}
      ASEMAN_IMPROVE_BUDGET: ${ASEMAN_IMPROVE_BUDGET:-}
      # The spaces' timelines: the Utopia server above and the node's account
      # in it. Set ASEMAN_TIMELINE_URL to an empty value to turn them off.
      ASEMAN_TIMELINE_URL: ${ASEMAN_TIMELINE_URL-http://timeline:1516}
      ASEMAN_TIMELINE_EMAIL: ${ASEMAN_TIMELINE_EMAIL:-timeline@aseman.local}
      ASEMAN_TIMELINE_PASSWORD: ${ASEMAN_TIMELINE_PASSWORD:?set ASEMAN_TIMELINE_PASSWORD in .env (./aseman.sh up generates one)}
      # Tools: the image managed Elpian VM / QuickJS backends run in, the
      # network they join (where the node reaches them by name), the node as
      # they reach it, and the compiler above.
      ASEMAN_TOOL_RUNTIME_IMAGE: ${ASEMAN_TOOL_RUNTIME_IMAGE:-aseman/tool-runtime:v1}
      ASEMAN_TOOL_RUNTIME_NETWORK: ${ASEMAN_TOOL_RUNTIME_NETWORK:-aseman_default}
      ASEMAN_TOOL_NODE_URL: ${ASEMAN_TOOL_NODE_URL:-http://aseman:8080}
      ASEMAN_TOOL_COMPILER_URL: ${ASEMAN_TOOL_COMPILER_URL-http://tool-runtime:8790}
      # Allow MCP tools on private addresses (e.g. MCP servers on this stack's
      # network). Off by default: tool URLs are user-supplied.
      ASEMAN_MCP_ALLOW_PRIVATE: ${ASEMAN_MCP_ALLOW_PRIVATE:-false}
      ASEMAN_HTTP_ADDR: ":8080"
      # The developer API's own host (api.example.com): on it the node serves
      # only that API, with bearer API keys. Empty: the API is off.
      ASEMAN_DEVELOPER_HOST: ${DEVELOPER_DOMAIN:-}
      # Where the node keeps files (chat attachments, developer Storage): an
      # S3-compatible bucket (Cloudflare R2, AWS S3, MinIO). Empty: the node's disk.
      ASEMAN_S3_BUCKET: ${S3_BUCKET:-}
      ASEMAN_S3_ENDPOINT: ${S3_ENDPOINT:-}
      ASEMAN_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      ASEMAN_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ASEMAN_S3_REGION: ${S3_REGION:-}
      ASEMAN_REVENUECAT_SECRET: ${ASEMAN_REVENUECAT_SECRET:-}
      ASEMAN_REVENUECAT_PRODUCTS: ${ASEMAN_REVENUECAT_PRODUCTS:-}
      # What buyers actually paid (after discounts), read from RevenueCat's v2 API.
      ASEMAN_REVENUECAT_PROJECT: ${ASEMAN_REVENUECAT_PROJECT:-}
      ASEMAN_REVENUECAT_V2_SECRET: ${ASEMAN_REVENUECAT_V2_SECRET:-}
      ASEMAN_RESEND_API_KEY: ${ASEMAN_RESEND_API_KEY:-}
      ASEMAN_SMTP_HOST: ${ASEMAN_SMTP_HOST:-}
      ASEMAN_SMTP_FROM: ${ASEMAN_SMTP_FROM:-}
      ASEMAN_SMTP_USER: ${ASEMAN_SMTP_USER:-}
      ASEMAN_SMTP_PASSWORD: ${ASEMAN_SMTP_PASSWORD:-}
      ASEMAN_GOOGLE_CLIENT_ID: ${ASEMAN_GOOGLE_CLIENT_ID:-}
      ASEMAN_APPLE_CLIENT_ID: ${ASEMAN_APPLE_CLIENT_ID:-}
      # iOS push notifications (an APNs auth key from the Apple developer account).
      ASEMAN_APNS_KEY: ${ASEMAN_APNS_KEY:-}
      ASEMAN_APNS_KEY_ID: ${ASEMAN_APNS_KEY_ID:-}
      ASEMAN_APNS_TEAM_ID: ${ASEMAN_APNS_TEAM_ID:-}
      ASEMAN_APNS_TOPIC: ${ASEMAN_APNS_TOPIC:-}
      ASEMAN_NODE_URL: ${ASEMAN_PUBLIC_URL:-http://localhost:8080}
      ASEMAN_ADMIN_PASSWORD: ${ASEMAN_ADMIN_PASSWORD:-changeme}
      # Optional: seeds the first LLM provider on first boot (manage keys in
      # the admin panel afterwards).
      ASEMAN_LLM_API_KEY: ${ASEMAN_LLM_API_KEY:-}
      ASEMAN_LLM_BASE_URL: ${ASEMAN_LLM_BASE_URL:-}
      ASEMAN_LLM_MODEL: ${ASEMAN_LLM_MODEL:-}
      # Optional: pin the built-in aseman lead agent to one of the
      # admin-configured LLM providers (by provider name/id/kind) + model.
      # Every other agent uses its own model or the node's default provider.
      ASEMAN_ORCHESTRATOR_PROVIDER: ${ASEMAN_ORCHESTRATOR_PROVIDER:-}
      ASEMAN_ORCHESTRATOR_MODEL: ${ASEMAN_ORCHESTRATOR_MODEL:-}
    volumes:
      - ${ASEMAN_CONFIG_FILE:-./services/configs/config.example.yml}:/app/config.yml:ro
      - aseman-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${ASEMAN_PORT:-8080}:8080"

  # The Flutter web client (nginx). It proxies the node's API (/v1) on the same
  # origin, so the browser only ever talks to this port.
  # ./aseman.sh up replaces this service with the debug server
  # (docker-compose.hotreload.yml): flutter run, hot reload on source changes.
  web:
    build:
      context: ./app
      args:
        # The developer API console shows where to call once a developer host is set.
        DEVELOPER_API_BASE: ${DEVELOPER_API_BASE:-${DEVELOPER_DOMAIN:+https://${DEVELOPER_DOMAIN}/v1}}
    image: aseman/flutter-web:latest
    restart: unless-stopped
    depends_on:
      aseman:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

  # Workload identity (SPIFFE/SPIRE), optional: docker compose --profile spire up
  # (deploy/spire/README.md).
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.2
    profiles: [spire]
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./deploy/spire/server.conf:/etc/spire/server.conf:ro
      - spire-server-data:/run/spire/data
      - spire-server-socket:/tmp/spire-server
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.11.2
    profiles: [spire]
    command: ["-config", "/etc/spire/oidc-discovery-provider.conf"]
    depends_on: [spire-server]
    volumes:
      - ./deploy/spire/oidc-discovery-provider.conf:/etc/spire/oidc-discovery-provider.conf:ro
      - spire-server-socket:/run/spire/server/private:ro
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.2
    profiles: [spire]
    command: ["-config", "/etc/spire/agent.conf"]
    pid: host
    depends_on: [spire-server]
    volumes:
      - ./deploy/spire/agent.conf:/etc/spire/agent.conf:ro
      - spire-sockets:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro
  spiffe-helper:
    image: ghcr.io/spiffe/spiffe-helper:0.10.0
    profiles: [spire]
    command: ["-config", "/etc/spire/helper.conf"]
    depends_on: [spire-agent]
    volumes:
      - ./deploy/spire/helper.conf:/etc/spire/helper.conf:ro
      - spire-sockets:/run/spire/sockets
      - spire-svid:/run/spire/svid

networks:
  default:
  # The database and what reads it directly; never the project computers.
  data:
    internal: true

volumes:
  spire-server-data:
  spire-server-socket:
  spire-sockets:
  spire-svid:
  postgres-data:
  aseman-data:
  openviking-data:
  timeline-data:
  voice-models:
  voice-kokoro:
  # Debug Flutter client (docker-compose.hotreload.yml): pub cache and the
  # SDK's .dart_tool, kept off the host tree.
  flutter-pub-cache:
  flutter-web-debug-dart-tool:
