<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>امپراتوری راه‌آهن پارس</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" href="icon.svg"/>
  <style>
    html, body { height: 100%; margin: 0; background: #3b2418; }
    .frame-wrap { position: fixed; inset: 0; }
    .frame-wrap iframe { border: 0; width: 100%; height: 100%; }
    .fallback { max-width: 420px; margin: 48px auto; padding: 16px; }
  </style>
</head>
<body>
  <div class="frame-wrap" id="godot-host" hidden>
    <iframe id="godot-frame" title="امپراتوری راه‌آهن پارس" allow="autoplay; fullscreen; gamepad"></iframe>
  </div>
  <main class="wrap fallback" id="hub">
    <header>
      <img src="icon.svg" alt="" width="72" height="72"/>
      <h1>امپراتوری راه‌آهن پارس</h1>
      <p class="tag">کل رابط کاربری داخل گودو است — همان زبان طراحی HUD بازی</p>
    </header>
    <div class="nine fantasy">
      <i class="tl"></i><i class="t"></i><i class="tr"></i>
      <i class="l"></i>
      <div class="c">
        <p style="margin:0;text-align:center;font-weight:700">سلام دوست خوبم!</p>
        <p style="margin:8px 0 12px;text-align:center;color:#5a4336">خانه، بازی، اطلس، افتخار و قوانین همگی داخل موتور گودو اجرا می‌شن.</p>
        <div style="display:grid;gap:8px">
          <a id="webgame" class="btn-accent" href="#">ورود به بازی گودو</a>
          <a class="btn-secondary" href="/api/rules">قوانین (API)</a>
          <a class="btn-secondary" href="/healthz">وضعیت سرویس</a>
        </div>
      </div>
      <i class="r"></i>
      <i class="bl"></i><i class="b"></i><i class="br"></i>
    </div>
  </main>
  <script src="hub.js"></script>
  <script>
    (function () {
      function mount(url) {
        var host = document.getElementById("godot-host");
        var frame = document.getElementById("godot-frame");
        var hub = document.getElementById("hub");
        if (!url || !frame) return;
        frame.src = url;
        host.hidden = false;
        if (hub) hub.hidden = true;
      }
      fetch("/api/game").then(function (r) { return r.json(); }).then(function (g) {
        var a = document.getElementById("webgame");
        if (g && g.web) {
          var url = "/" + String(g.web).replace(/^\//, "");
          if (a) a.href = url;
          if (/[?&]embed=1\b/.test(location.search) || location.hash === "#play") mount(url);
        }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
