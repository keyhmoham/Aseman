# Aseman Node Configuration (Docker Compose stack)
#
# This file defines node-level identity, authentication client IDs, and sandbox backends.
# Default settings are used automatically if services/configs/config.yml is absent.
# To customize, copy this file to services/configs/config.yml (which is gitignored).
#
# Note: Infrastructure services (PostgreSQL, Nomad, Docker, Storage, Resend/SMTP,
# and RevenueCat backend secret) are configured via environment variables in .env.

node:
  # Node name (also used as the handle for the bootstrap admin account)
  name: "node-a"

  # Google Sign-In Web OAuth Client ID (optional)
  # When set, the backend verifies that Google ID tokens are issued for this client.
  oauth_client_id: ""

sandbox:
  # Shared per-space agent sandbox backbone:
  # "docker" = one isolated Docker container per space on the host daemon (default)
  # "modal"  = one remote Modal sandbox container per space
  backend: "docker"
  docker_network: "aseman_default"

# Modal credentials (required only when sandbox.backend is set to "modal"):
# modal:
#   token_id: "ak-..."
#   token_secret: "as-..."
#   environment: "dev"   # optional: Modal environment for sandboxes, volumes and costs
