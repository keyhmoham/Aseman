# aseman node configuration — FULL REFERENCE (explicit plugin wiring).
#
# You normally do NOT need this: configs/config.yml only carries node identity,
# Google sign-in and the Modal credentials, and the infrastructure is wired
# automatically (docker compose / ASEMAN_* environment variables). Use this
# format only to wire adapters by hand; ASEMAN_* variables still override the
# matching settings (DSN, nomad URL, docker host, ...).
node:
  # id is the 16-hex federation node id. Leave EMPTY on first run to have it
  # allocated from the current timestamp: the central node allocates it when
  # central_url is set, or this node self-allocates when central: true. The
  # allocated id is persisted at data/node-id for later runs.
  id: "0000000000000001"     # 16-hex federation node id ("" = bootstrap)
  name: "node-a"             # node name (also used as the admin handle)
  url: "http://localhost:8080"
  central: true              # central node mints credits and allocates node ids
  # central_url: "http://localhost:8080"  # for non-central nodes (id allocation)
  # private_key: "..."       # optional Ed25519 node private key (hex);
  #                           # auto-generated and persisted at data/node-<id>.key
  oauth_client_id: ""        # Google OAuth client id for Google sign-in

logger:
  level: info                # debug | info | warn | error
  dir: "data/logs"           # per-plugin log files (data/logs/<plugin>.log)

http:
  addr: ":8080"

sandbox:                      # shared per-space sandbox backbone
  backend: "docker"           # "docker" = one docker container per space (default)
                              # "modal"  = one Modal remote sandbox per space
  # docker_network: "aseman_default"  # network the node is on; sandbox containers
                              # join it so proxied ports are reachable from a
                              # containerized node (empty = docker bridge)

plugins:
  # Built by make plugins with the same toolchain as the daemon.
  directory: bin/plugins
  source_root: .
  adapters:
    - name: postgres          # PostgreSQL database (persistent)
      enabled: true
      config:
        dsn: "postgres://aseman:aseman@localhost:5432/aseman?sslmode=disable"
    - name: local-cache       # in-process cache (default)
      enabled: true
    - name: local             # local filesystem storage (default)
      enabled: true
      config:
        base_path: "./data/files"
    - name: http              # HTTP network (default)
      enabled: true
      config:
        addr: ":8080"
    - name: nomad             # default VMM provider (docker VMs via Nomad)
      enabled: true
      config:
        nomad_url: "http://localhost:4646"
    - name: docker            # shared per-space agent sandbox (docker VM)
      enabled: true
      config:
        options:
          host: "unix:///var/run/docker.sock"
    - name: deepagents        # every agent: LangChain Deep Agents runtime
      enabled: true
      config:
        options:
          node_url: "http://aseman:8080"        # the node as the runtime reaches it
          image: "aseman/deepagents:v2"         # runtime image, run on Nomad
          network: "aseman_default"             # docker network the runtime joins
          # runtime_url: "http://localhost:8000"   # or run the runtime yourself
          image_model: "gpt-image-1"   # model behind the agents' image_generate tool
    - name: modal             # shared per-space agent sandbox (Modal remote sandbox VM)
      enabled: true
      config:
        options:
          modal_token_id: "..."
          modal_token_secret: "..."
    - name: wasm              # app backends (wasm VMs)
      enabled: true
      config:
        options:
          module_root: "./data/wasm"

