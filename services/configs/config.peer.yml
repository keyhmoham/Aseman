# Peer federation node (see README "Running a two-node mesh").
# On its first run this node has no id: it requests a timestamp-derived id
# from the central node (central_url) and persists it for later runs.
node:
  id: ""                       # empty => allocate from the central node on first run
  name: "node-b"
  url: "http://localhost:8081"
  central: false
  central_url: "http://localhost:8080"   # central node that allocates node ids

logger:
  level: info
  dir: "data/logs"

http:
  addr: ":8081"

plugins:
  adapters:
    - name: postgres          # PostgreSQL database (persistent, own node DB)
      enabled: true
      config:
        dsn: "postgres://tradera:tradera@localhost:5432/tradera_peer?sslmode=disable"
    - name: local-cache
      enabled: true
    - name: local
      enabled: true
      config:
        base_path: "./data/files"
    - name: http
      enabled: true
      config:
        addr: ":8081"
    - name: nomad          # default VMM provider (docker VMs via Nomad)
      enabled: true
      config:
        nomad_url: "http://localhost:4646"