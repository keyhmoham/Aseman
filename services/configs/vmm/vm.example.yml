# Tradera VM configuration (YAML).
# This file is given to the bots.bot_create action (spec_yml) or to a VMM
# adapter's BuildImage. Each VM type interprets the fields it needs.

name: "hello-bot"            # VM/bot name
vm_type: "docker"            # docker | wasm | modal | deepagents
image: "busybox"             # image reference (docker image, wasm module path, ...)
entrypoint: "/bin/sh"
args: ["-c", "while true; do echo hello; sleep 5; done"]

resources:
  cpu: 0.5                   # vCPU
  memory: 128                # MB
  disk: 256                  # MB
  max_runtime_sec: 3600      # optional hard runtime cap

environment:
  LOG_LEVEL: "info"

# Agent definition (vm_type: deepagents): the agent's VM image. It runs on the
# deep agents runtime (plugins/adapters/vmm/deepagents).
# name: "researcher"
# description: "Finds and summarizes sources"
# provider: "openai"           # an admin-configured LLM provider (optional)
# model: "gpt-5.4"
# instructions: |
#   You research questions thoroughly and cite your sources.
# skills:                      # loaded progressively from SKILL.md files
#   - name: "literature-review"
#     description: "Systematic literature reviews"
#     instructions: "Search broadly, then narrow; keep a sources.md in /workspace."
# interrupt_on: ["execute"]    # tools that wait for a person's approval
# max_turns: 40

# WASM modules (vm_type: wasm) point image to a .wasm file path relative to
# the adapter's module_root.
# image: "hello.wasm"