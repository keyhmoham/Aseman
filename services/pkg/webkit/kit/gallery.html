<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aseman web UI kit</title>
<link rel="stylesheet" href="aseman-ui.css">
<script src="aseman-ui.js"></script>
<style>
  .g-swatch { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .g-swatch i { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--t-card-border); }
</style>
</head>
<body class="t-page">
<script>
  // The gallery answers its own microtool calls (its tools are made up).
  Aseman.configure({ mockAlways: true, mock: {
    Weather: {
      forecast: ({ city = 'Oslo' }) => ({ city, temp: 12 + city.length, humidity: 0.64, wind: 5.2, conditions: 'Partly cloudy',
        days: [ { day: 'Mon', high: 14, low: 7 }, { day: 'Tue', high: 16, low: 8 }, { day: 'Wed', high: 13, low: 6 }, { day: 'Thu', high: 17, low: 9 }, { day: 'Fri', high: 18, low: 11 } ] }),
    },
    Markets: {
      quote: ({ symbol = 'BTC' }) => ({ symbol, price: 64000 + Math.random() * 400, change: (Math.random() - 0.45) / 20 }),
    },
  } });
  Aseman.data.set('/form', { city: 'Oslo', qty: 2, side: 'buy', notify: true, range: [20, 70], level: 40, when: '2026-10-19', rating: 3, tags: ['crypto'] });
  Aseman.data.set('/prices', Array.from({ length: 30 }, (_, i) => ({ date: new Date(2026, 8, i + 1).toISOString(), btc: 60000 + Math.sin(i / 3) * 3000 + i * 120, eth: 3000 + Math.cos(i / 4) * 200 + i * 9 })));
  Aseman.data.set('/positions', [
    { symbol: 'BTC', name: 'Bitcoin', value: 42100, change: 0.023, weight: 0.42, status: 'good', trend: [1, 3, 2, 5, 4, 6] },
    { symbol: 'ETH', name: 'Ether', value: 18300, change: -0.011, weight: 0.18, status: 'warning', trend: [5, 4, 4, 3, 4, 2] },
    { symbol: 'SOL', name: 'Solana', value: 9100, change: 0.051, weight: 0.09, status: 'good', trend: [2, 2, 3, 4, 6, 7] },
    { symbol: 'USDT', name: 'Tether', value: 30500, change: 0, weight: 0.31, status: 'critical', trend: [1, 1, 1, 1, 1, 1] },
  ]);
  Aseman.on('remove', (ctx) => Aseman.toast(`Remove ${ctx.symbol}`));
</script>

<t-column gap="20">
  <t-row justify="spaceBetween">
    <t-column gap="2"><t-text variant="h3" text="Aseman web UI kit"></t-text><t-text variant="caption" text="Every component of the app, for web pages"></t-text></t-column>
    <t-row gap="4"><t-brand size="28" label="false"></t-brand><t-icon-button icon="dark_mode" tooltip="Toggle theme" id="theme"></t-icon-button></t-row>
  </t-row>

  <t-section title="Typography" icon="title">
    <t-card>
      <t-text variant="h1">Heading 1</t-text><t-text variant="h2">Heading 2</t-text><t-text variant="h3">Heading 3</t-text>
      <t-text variant="h4">Heading 4</t-text><t-text variant="h5">Heading 5</t-text>
      <t-text variant="body" text="Body text with **bold**, _italic_, `code` and a [link](https://aseman.app)."></t-text>
      <t-text variant="caption" text="Caption: units, timestamps, help."></t-text>
      <t-markdown text="### Markdown&#10;- one&#10;- [x] done task&#10;&#10;| a | b |&#10;|---|--:|&#10;| 1 | 2 |&#10;&#10;> A quote"></t-markdown>
      <p>Plain HTML: <strong>strong</strong> <em>em</em> <mark>mark</mark> <kbd>Ctrl</kbd> <del>del</del> <ins>ins</ins> <abbr title="Aseman">TRD</abbr> x<sup>2</sup> H<sub>2</sub>O <code>code</code></p>
      <t-math-expression expression="E = mc^2 + \frac{a}{b} \cdot \alpha"></t-math-expression>
    </t-card>
  </t-section>

  <t-section title="Colors" icon="palette">
    <t-wrap id="swatches"></t-wrap>
  </t-section>

  <t-section title="Buttons and chips" icon="smart_button">
    <t-wrap>
      <t-button variant="primary" text="Primary" icon="add"></t-button>
      <t-button text="Default"></t-button>
      <t-button variant="tonal" text="Tonal"></t-button>
      <t-button variant="borderless" text="Borderless"></t-button>
      <t-button variant="destructive" text="Delete" icon="delete"></t-button>
      <t-button variant="primary" text="Calls a tool" call="Weather/forecast" args='{"city":{"path":"/form/city"}}' into="/forecast" toast="Forecast loaded"></t-button>
      <t-button disabled text="Disabled"></t-button>
      <t-icon-button icon="refresh" tooltip="Refresh"></t-icon-button>
      <t-icon-button icon="star" variant="filled" tooltip="Filled"></t-icon-button>
      <t-icon-button icon="tune" variant="tonal" tooltip="Tonal"></t-icon-button>
      <t-icon-button icon="share" variant="outlined" tooltip="Outlined"></t-icon-button>
      <t-menu items='[{"label":"Edit","icon":"edit"},{"label":"Share","icon":"share"},{"divider":true},{"label":"Delete","icon":"delete","destructive":true}]'></t-menu>
    </t-wrap>
    <t-wrap>
      <t-chip label="Chip"></t-chip><t-chip label="Selected" selected></t-chip><t-chip label="With icon" icon="bolt"></t-chip>
      <t-badge text="Good" status="good"></t-badge><t-badge text="Warning" status="warning"></t-badge><t-badge text="Serious" status="serious"></t-badge>
      <t-badge text="Critical" status="critical" variant="filled"></t-badge><t-tag text="Outline" color="violet" variant="outline"></t-tag>
      <t-badge count="3"><t-icon name="notifications"></t-icon></t-badge>
      <t-mini-tag text="New"></t-mini-tag><t-status-tag text="Live" status="good"></t-status-tag>
      <t-avatar name="Ada Lovelace"></t-avatar><t-avatar-group people='[{"name":"Ann"},{"name":"Bo Li"},{"name":"Cy"},{"name":"Dee"},{"name":"Eve"},{"name":"Fay"}]'></t-avatar-group>
      <t-trend value="0.034" format="+percent:1"></t-trend><t-trend value="-12.5"></t-trend>
      <t-rating value="3.5" show-value></t-rating>
      <t-link text="A link" url="https://aseman.app"></t-link>
    </t-wrap>
  </t-section>

  <t-section title="Inputs" icon="edit">
    <t-card>
      <t-grid min-column-width="240">
        <t-text-field label="City" bind-value="/form/city" helper="Bound to /form/city" checks='[{"condition":{"call":"required","args":{"value":{"path":"/form/city"}}},"message":"Name a city"}]'></t-text-field>
        <t-text-field label="Password" variant="obscured" placeholder="••••••"></t-text-field>
        <t-text-field label="Notes (optional)" variant="longText"></t-text-field>
        <t-search-field placeholder="Search symbols" bind-value="/form/q"></t-search-field>
        <t-dropdown label="Exchange" options='["Binance","Coinbase","Kraken"]' bind-value="/form/exchange" placeholder="Pick one"></t-dropdown>
        <t-date-time-input label="Date" bind-value="/form/when"></t-date-time-input>
        <t-slider label="Level" bind-value="/form/level" min="0" max="100" format="integer"></t-slider>
        <t-range-slider label="Range" bind-value="/form/range" min="0" max="100" format="integer"></t-range-slider>
      </t-grid>
      <t-wrap>
        <t-segmented-control bind-value="/form/side" options='[{"label":"Buy","value":"buy"},{"label":"Sell","value":"sell"}]'></t-segmented-control>
        <t-number-stepper label="Quantity" bind-value="/form/qty" min="0" max="10"></t-number-stepper>
        <t-checkbox label="Remember" bind-value="/form/remember"></t-checkbox>
        <t-switch label="Notify me" bind-value="/form/notify"></t-switch>
        <t-radio label="Market" value="market" bind-group-value="/form/kind"></t-radio><t-radio label="Limit" value="limit" bind-group-value="/form/kind"></t-radio>
        <t-rating bind-value="/form/rating" editable></t-rating>
      </t-wrap>
      <t-choice-picker label="Markets" variant="multipleSelection" bind-value="/form/tags" options='[{"label":"Crypto","value":"crypto"},{"label":"Stocks","value":"stocks"},{"label":"FX","value":"fx"}]'></t-choice-picker>
      <t-segmented-tab-bar bind-value="/form/tab" tabs='["Overview","Orders","History"]'></t-segmented-tab-bar>
      <t-text variant="caption" bind-text="/form/city"></t-text>
    </t-card>
  </t-section>

  <t-section title="Calling a tool" icon="bolt" subtitle="t-data loads a microtool into the data model and reloads when its bound args change">
    <t-data call="Weather/forecast" args='{"city":{"path":"/form/city"}}' into="/forecast"></t-data>
    <t-card>
      <t-show when='{"path":"/forecast__loading"}'><t-loading text="Loading the forecast…"></t-loading></t-show>
      <t-grid min-column-width="150">
        <t-stat label="Temperature" bind-value="/forecast/temp" format="number:1" icon="thermostat"></t-stat>
        <t-stat label="Humidity" bind-value="/forecast/humidity" format="percent"></t-stat>
        <t-stat label="Wind" bind-value="/forecast/wind" format="number:1" delta="0.12" delta-format="+percent:1" delta-label="vs yesterday"></t-stat>
      </t-grid>
      <t-chart type="bar" title="Next days" bind-data="/forecast/days" x="day" series='[{"field":"high","label":"High"},{"field":"low","label":"Low"}]' height="200" y-format="number:0"></t-chart>
    </t-card>
  </t-section>

  <t-section title="Data" icon="table_chart">
    <t-grid min-column-width="160">
      <t-card><t-stat label="Portfolio" value="100000" format="currency:USD" delta="0.021" delta-format="+percent:2" trend="[1,2,3,2,4,5,6]"></t-stat></t-card>
      <t-card><t-stat label="Today" value="-1240" format="+currency:USD" delta="-0.012" delta-format="+percent:2" status="critical" icon="trending_down"></t-stat></t-card>
      <t-card><t-gauge value="72" label="Risk" thresholds='[{"value":40,"status":"good"},{"value":70,"status":"warning"},{"value":100,"status":"critical"}]' size="150"></t-gauge></t-card>
      <t-card><t-progress value="0.62" label="Allocation"></t-progress><t-progress value="40" variant="circular" label="Done"></t-progress></t-card>
    </t-grid>
    <t-table title="Positions" search page-size="10" bind-data="/positions" bind-selection="/selected"
      columns='[{"field":"symbol","label":"Symbol","type":"avatar"},{"field":"value","type":"number","format":"currency"},{"field":"change","type":"trend","format":"percent:2"},{"field":"weight","type":"progress"},{"field":"status","type":"badge"},{"field":"trend","type":"sparkline"}]'></t-table>
    <t-callout severity="info" title="Selection" text="Tap a row: the detail below binds to /selected."></t-callout>
    <t-key-value bind-data="/selected" columns="2"></t-key-value>
    <t-grid min-column-width="300">
      <t-card><t-timeline data='[{"title":"Order placed","time":"2026-10-18T09:12:00Z","status":"good"},{"title":"Partially filled","description":"0.4 of 1 BTC","time":"2026-10-18T09:40:00Z","status":"warning"},{"title":"Cancelled","time":"2026-10-18T10:02:00Z","status":"critical","icon":"close"}]'></t-timeline></t-card>
      <t-card><t-tree-view expanded="1" data='{"label":"Portfolio","children":[{"label":"Crypto","value":69500,"children":[{"label":"BTC","value":42100},{"label":"ETH","value":18300}]},{"label":"Cash","value":30500}]}'></t-tree-view></t-card>
      <t-card><t-json-view value='{"symbol":"BTC","price":64012.5,"live":true,"tags":["a","b"],"meta":null}'></t-json-view></t-card>
      <t-card><t-code-block language="js" line-numbers code="const r = await Aseman.call('Weather', 'forecast', {city: 'Oslo'});&#10;// returns the microtool's value"></t-code-block></t-card>
    </t-grid>
  </t-section>

  <t-section title="Charts" icon="show_chart">
    <t-grid min-column-width="320">
      <t-card><t-chart type="line" title="BTC and ETH" bind-data="/prices" x="date" x-format="date" series='["btc"]' smooth y-format="compact"></t-chart></t-card>
      <t-card><t-chart type="area" title="Area" bind-data="/prices" x="date" x-format="date" y="eth" y-format="compact"></t-chart></t-card>
      <t-card><t-chart type="bar" title="Stacked" stacked data='[{"q":"Q1","a":3,"b":2,"c":1},{"q":"Q2","a":4,"b":3,"c":2},{"q":"Q3","a":5,"b":2,"c":3}]' x="q" series='["a","b","c"]' value-labels></t-chart></t-card>
      <t-card><t-chart type="bar" horizontal title="Horizontal" data='[{"n":"Alpha","v":12},{"n":"Beta","v":7},{"n":"Gamma","v":15}]' x="n" y="v"></t-chart></t-card>
      <t-card><t-chart type="candlestick" title="Candles" data='[{"t":"Mon","open":10,"high":14,"low":9,"close":13},{"t":"Tue","open":13,"high":15,"low":11,"close":12},{"t":"Wed","open":12,"high":16,"low":12,"close":15},{"t":"Thu","open":15,"high":15,"low":10,"close":11}]' x="t"></t-chart></t-card>
      <t-card><t-chart type="scatter" title="Scatter" data='[{"x":1,"y":2},{"x":2,"y":3.5},{"x":3,"y":2.8},{"x":4,"y":5}]' x="x" y="y"></t-chart></t-card>
      <t-card><t-chart type="bubble" title="Bubble" data='[{"x":1,"y":2,"s":10},{"x":2,"y":3,"s":40},{"x":3,"y":1,"s":20}]' x="x" y="y" size="s"></t-chart></t-card>
      <t-card><t-chart type="histogram" title="Histogram" data='[1,2,2,3,3,3,4,4,5,6,6,6,6,7,8,9]' field="value" bins="6"></t-chart></t-card>
      <t-card><t-chart type="donut" title="Donut" bind-data="/positions" label="symbol" value="value" center-label="Total" format="compact"></t-chart></t-card>
      <t-card><t-chart type="pie" title="Pie" data='[{"label":"A","value":3},{"label":"B","value":2},{"label":"C","value":1}]'></t-chart></t-card>
      <t-card><t-chart type="radar" title="Radar" data='[{"label":"Speed","a":4,"b":3},{"label":"Risk","a":2,"b":4},{"label":"Yield","a":5,"b":2},{"label":"Liquidity","a":3,"b":5},{"label":"Cost","a":4,"b":4}]' series='["a","b"]'></t-chart></t-card>
      <t-card><t-heatmap title="Heatmap" rows='["Mon","Tue","Wed"]' columns='["9h","12h","15h","18h"]' values='[[1,-2,3,4],[-3,2,0,1],[2,4,-1,3]]'></t-heatmap></t-card>
      <t-card><t-treemap title="Treemap" bind-data="/positions" label="symbol" value="value" color-by="change"></t-treemap></t-card>
      <t-card><t-graph title="Graph" directed nodes='[{"id":"a","label":"Agent","group":"ai"},{"id":"t","label":"Tool","group":"tool"},{"id":"u","label":"You","group":"person"},{"id":"m","label":"Market","group":"tool"}]' edges='[{"from":"u","to":"a"},{"from":"a","to":"t"},{"from":"t","to":"m","label":"calls"}]' height="240"></t-graph></t-card>
    </t-grid>
    <t-row><t-sparkline values="[3,5,4,6,8,7,9]" width="140" height="36" type="area"></t-sparkline><t-sparkline values="[9,7,8,5,4,5,3]" type="bar"></t-sparkline></t-row>
  </t-section>

  <t-section title="Markets" icon="candlestick_chart">
    <t-grid min-column-width="300">
      <t-card>
        <t-quote symbol="BTC" name="Bitcoin" price="64012.5" change="0.023" currency="USD" trend="[1,3,2,4,5]"></t-quote>
        <t-quote symbol="ETH" name="Ether" price="3012.1" change="-0.011" currency="USD" trend="[5,4,4,3,2]"></t-quote>
      </t-card>
      <t-card><t-quote symbol="SOL" name="Solana" size="large" price="148.3" change="0.051" currency="USD" trend="[2,2,3,4,6,7,6,8]" caption="Updated just now"></t-quote></t-card>
      <t-card><t-order-book title="Order book" levels="5" bids='[[64000,1.2],[63990,0.8],[63980,2.4],[63970,1.1]]' asks='[[64010,0.5],[64020,1.7],[64030,0.9],[64040,3.1]]'></t-order-book></t-card>
      <t-card><t-allocation-bar title="Allocation" bind-data="/positions" label="symbol" value="value"></t-allocation-bar><t-countdown label="Next rebalance" target="2027-01-01T00:00:00Z"></t-countdown></t-card>
    </t-grid>
    <t-ticker-tape data='[{"symbol":"BTC","price":64012,"change":0.02},{"symbol":"ETH","price":3012,"change":-0.01},{"symbol":"SOL","price":148,"change":0.05},{"symbol":"BNB","price":580,"change":0.003}]'></t-ticker-tape>
  </t-section>

  <t-section title="Navigation and overlays" icon="tab">
    <t-tabs>
      <t-tab title="Overview" icon="dashboard"><t-text text="The first tab."></t-text></t-tab>
      <t-tab title="Orders" icon="receipt_long"><t-empty-state icon="inbox" title="No orders" text="Orders you place show here."><t-button variant="primary" text="Place an order"></t-button></t-empty-state></t-tab>
      <t-tab title="Loading"><t-skeleton variant="lines"></t-skeleton><t-skeleton variant="card"></t-skeleton></t-tab>
    </t-tabs>
    <t-accordion>
      <t-expandable title="What is this?" subtitle="An expandable"><t-text text="Folded content."></t-text></t-expandable>
      <t-expandable title="Second"><t-text text="More."></t-text></t-expandable>
    </t-accordion>
    <t-wrap>
      <t-modal title="A dialog"><t-button slot="trigger" text="Open dialog"></t-button><t-text text="Dialog content."></t-text></t-modal>
      <t-modal title="A sheet" variant="sheet"><t-button slot="trigger" text="Open sheet"></t-button><t-text text="Sheet content."></t-text></t-modal>
      <t-tooltip message="A tooltip"><t-chip label="Hover me"></t-chip></t-tooltip>
      <t-button text="Toast" action='{"functionCall":{"call":"showToast","args":{"message":"Hello"}}}'></t-button>
      <t-button text="Toggle detail" action='{"functionCall":{"call":"toggle","args":{"path":"/ui/open"}}}'></t-button>
    </t-wrap>
    <t-show when='{"path":"/ui/open"}'><t-callout severity="good" title="Shown" text="Only while /ui/open holds."></t-callout><t-callout slot="fallback" severity="warning" text="Hidden: press Toggle detail."></t-callout></t-show>
    <t-steps current="1" steps='[{"title":"Placed"},{"title":"Filled","description":"Waiting for the exchange"},{"title":"Settled"}]'></t-steps>
    <t-steps direction="horizontal" steps='[{"title":"One","status":"done"},{"title":"Two","status":"error"},{"title":"Three"}]'></t-steps>
    <t-carousel height="120"><t-card variant="filled"><t-text variant="h4" text="Page 1"></t-text></t-card><t-card variant="filled"><t-text variant="h4" text="Page 2"></t-text></t-card><t-card variant="filled"><t-text variant="h4" text="Page 3"></t-text></t-card></t-carousel>
  </t-section>

  <t-section title="Lists and templates" icon="view_list">
    <t-list each="/positions" gap="4"><template><t-card variant="filled" padding="12"><t-row><t-avatar bind-name="symbol" size="32"></t-avatar><t-column gap="0" weight="1"><t-text bind-text="name"></t-text><t-text variant="caption" bind-text="symbol"></t-text></t-column><t-trend bind-value="change" format="+percent:2"></t-trend><t-icon-button icon="delete" tooltip="Remove" action='{"event":{"name":"remove","context":{"symbol":{"path":"symbol"}}}}'></t-icon-button></t-row></t-card></template></t-list>
  </t-section>

  <t-section title="Layout and Elpian widgets" icon="widgets">
    <t-grid min-column-width="220">
      <t-container padding="16" color="primaryContainer" border-radius="20"><t-text text="Container"></t-text></t-container>
      <t-aspect-ratio ratio="2"><t-center style="background:var(--t-surface-container-high);border-radius:16px"><t-text text="AspectRatio 2:1"></t-text></t-center></t-aspect-ratio>
      <t-stack height="80"><t-box color="series-1" border-radius="16" height="80"></t-box><t-positioned top="8" left="8"><t-badge text="Stacked" variant="filled" color="orange"></t-badge></t-positioned></t-stack>
      <t-transform rotate="-3"><t-card><t-text text="Transform"></t-text></t-card></t-transform>
      <t-opacity opacity="0.5"><t-card><t-text text="Opacity 0.5"></t-text></t-card></t-opacity>
      <t-pulse><t-card><t-text text="Pulse"></t-text></t-card></t-pulse>
      <t-shimmer><t-card><t-text text="Shimmer"></t-text></t-card></t-shimmer>
      <t-animated-gradient border-radius="16" height="60"></t-animated-gradient>
      <t-fade-transition><t-card><t-text text="FadeTransition"></t-text></t-card></t-fade-transition>
      <t-inkwell action='{"functionCall":{"call":"showToast","args":{"message":"InkWell tapped"}}}' border-radius="16"><t-card><t-text text="InkWell (tap)"></t-text></t-card></t-inkwell>
      <t-dismissible><t-card><t-text text="Dismissible (swipe)"></t-text></t-card></t-dismissible>
      <t-row><t-draggable data='"BTC"'><t-chip label="Drag BTC"></t-chip></t-draggable><t-drag-target action='{"functionCall":{"call":"showToast","args":{"message":"Dropped"}}}'><t-card padding="10"><t-text text="Drop here"></t-text></t-card></t-drag-target></t-row>
      <t-canvas width="200" height="80" commands='[{"type":"fillRect","x":10,"y":10,"width":60,"height":60,"color":"series-2"},{"type":"circle","x":120,"y":40,"radius":28,"color":"series-1"}]'></t-canvas>
      <t-row><t-circular-progress-indicator></t-circular-progress-indicator><t-linear-progress-indicator weight="1"></t-linear-progress-indicator></t-row>
      <t-elpian node='{"type":"Container","props":{"style":{"padding":12,"backgroundColor":"surfaceHigh","borderRadius":16}},"children":[{"type":"Row","children":[{"type":"Icon","props":{"icon":"bolt"}},{"type":"Text","props":{"text":"An Elpian node tree"}}]}]}'></t-elpian>
      <t-panel><t-panel-header title="Panel" subtitle="AppPanel + PanelHeader" icon="dashboard"><t-icon-button icon="more_vert"></t-icon-button></t-panel-header></t-panel>
    </t-grid>
    <t-divider></t-divider>
    <t-app-bar title="AppBar" leading="menu"><t-icon-button icon="search"></t-icon-button></t-app-bar>
  </t-section>

  <t-section title="A2UI surface" icon="auto_awesome" subtitle="The same JSON the app renders">
    <t-surface>
      <script type="application/json">{"components":[{"id":"root","component":"Column","children":["h","g","b"]},{"id":"h","component":"Text","variant":"h5","text":"Hello ${/name}"},{"id":"g","component":"Grid","minColumnWidth":150,"children":{"componentId":"s","path":"/stats"}},{"id":"s","component":"Stat","label":{"path":"label"},"value":{"path":"value"}},{"id":"b","component":"Button","variant":"primary","child":"bt","action":{"functionCall":{"call":"increment","args":{"path":"/stats/0/value"}}}},{"id":"bt","component":"Text","text":"Increment"}],"data":{"name":"Aseman","stats":[{"label":"Clicks","value":1},{"label":"Users","value":42}]}}</script>
    </t-surface>
  </t-section>

  <t-section title="Native HTML" icon="html">
