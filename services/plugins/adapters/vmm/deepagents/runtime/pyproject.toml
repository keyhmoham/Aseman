[project]
name = "tradera-agents"
version = "0.1.0"
description = "Tradera's agent runtime: agents on a self-hosted OpenCode, orchestrated as a swarm with LangChain Deep Agents."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["tradera_agents", "tradera_agents.decision", "tradera_agents.opencode", "tradera_agents.swarm", "tradera_agents.harness"]

[tool.setuptools.package-data]
"tradera_agents.opencode" = ["plugin/*.ts"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
