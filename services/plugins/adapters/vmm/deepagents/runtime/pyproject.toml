[project]
name = "tradera-agents"
version = "0.1.0"
description = "Tradera's deep agents runtime: tradera agents on LangChain Deep Agents (LangGraph)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["tradera_agents", "tradera_agents.decision", "tradera_agents.swarm", "tradera_agents.improve"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
