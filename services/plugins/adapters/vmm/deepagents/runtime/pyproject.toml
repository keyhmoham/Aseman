[project]
name = "aseman-agents"
version = "0.1.0"
description = "Aseman's deep agents runtime: aseman agents on LangChain Deep Agents (LangGraph)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["aseman_agents", "aseman_agents.decision", "aseman_agents.swarm", "aseman_agents.improve", "aseman_agents.opencode_engine"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
